<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - Search Results</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #0066cc;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-right: 25px;
            font-size: 16px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            width: 200px;
        }
        .search-box button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
        }
        .content {
            padding: 30px 50px;
        }
        h2 {
            color: #006600;
            text-align: center;
            font-size: 28px;
        }
        .results-label {
            color: #0066cc;
            font-style: italic;
            text-decoration: underline;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            border: 2px solid #66cccc;
        }
        th, td {
            border: 1px solid #66cccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #e6ffff;
            font-weight: bold;
        }
        .no-results {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #0066cc;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div>
            <a href="main.html">Home</a>
            <a href="viewall.html">View All Items</a>
            <a href="buy.html">Buy an Item</a>
            <a href="viewcart.html">View Cart</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Items">
            <button onclick="doSearch()">&#128269;</button>
        </div>
    </div>

    <!-- Content area -->
    <div class="content">
        <h2>Search results</h2>
        <p class="results-label">Results</p>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>ITEM#</th>
                    <th>NAME</th>
                    <th>COLOR</th>
                    <th>DESCRIPTION</th>
                    <th>PRICE</th>
                    <th>AVAILABLE</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <!-- Search results will be loaded here -->
            </tbody>
        </table>

        <div id="noResults" class="no-results" style="display:none;">No items found.</div>

        <p class="back-link">Go back to <a href="main.html">Main Menu</a></p>
    </div>

    <script>
        // Get search query from URL parameter
        window.onload = function() {
            var params = new URLSearchParams(window.location.search);
            var query = params.get('query');

            if (query) {
                document.getElementById('searchInput').value = query;
                searchItems(query);
            }
        };

        // Fetch search results from the server
        function searchItems(query) {
            fetch('api/search?query=' + encodeURIComponent(query))
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    var tbody = document.getElementById('resultsBody');
                    tbody.innerHTML = '';

                    if (data.results.length === 0) {
                        document.getElementById('noResults').style.display = 'block';
                        document.getElementById('resultsTable').style.display = 'none';
                        return;
                    }

                    data.results.forEach(function(item) {
                        var row = document.createElement('tr');
                        row.innerHTML = '<td>' + item.itemId + '</td>' +
                            '<td>' + item.name + '</td>' +
                            '<td>' + item.color + '</td>' +
                            '<td>' + item.description + '</td>' +
                            '<td>R' + item.price.toFixed(0) + '</td>' +
                            '<td>' + item.available + '</td>';
                        tbody.appendChild(row);
                    });
                } else {
                    document.getElementById('noResults').textContent = data.message;
                    document.getElementById('noResults').style.display = 'block';
                }
            })
            .catch(function(error) {
                document.getElementById('noResults').textContent = 'Error searching items.';
                document.getElementById('noResults').style.display = 'block';
            });
        }

        // New search from search box
        function doSearch() {
            var query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                searchItems(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
