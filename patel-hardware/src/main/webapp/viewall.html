<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - View All Items</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #0066cc;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-right: 25px;
            font-size: 16px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            width: 200px;
        }
        .search-box button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
        }
        .content {
            padding: 30px 50px;
        }
        h2 {
            color: #006600;
            text-align: center;
            font-size: 28px;
        }
        p.subtitle {
            text-align: center;
            font-style: italic;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            border: 2px solid #66cccc;
        }
        th, td {
            border: 1px solid #66cccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #e6ffff;
            font-weight: bold;
        }
        .buy-btn {
            padding: 6px 14px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .buy-btn:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div>
            <a href="main.html">Home</a>
            <a href="viewall.html">View All Items</a>
            <a href="buy.html">Buy an Item</a>
            <a href="viewcart.html">View Cart</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Items">
            <button onclick="searchItems()">&#128269;</button>
        </div>
    </div>

    <!-- Content area -->
    <div class="content">
        <h2>View All Items</h2>
        <p class="subtitle">Below is the list of all the item in the hardware</p>

        <table id="itemsTable">
            <thead>
                <tr>
                    <th>ITEM#</th>
                    <th>NAME</th>
                    <th>COLOR</th>
                    <th>DESCRIPTION</th>
                    <th>PRICE</th>
                    <th>AVAILABLE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="itemsBody">
                <!-- Items will be loaded here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Load all items when the page loads
        window.onload = function() {
            loadItems();
        };

        // Fetch all items from the server
        function loadItems() {
            fetch('api/items')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    var tbody = document.getElementById('itemsBody');
                    tbody.innerHTML = '';

                    data.items.forEach(function(item) {
                        var row = document.createElement('tr');
                        row.innerHTML = '<td>' + item.itemId + '</td>' +
                            '<td>' + item.name + '</td>' +
                            '<td>' + item.color + '</td>' +
                            '<td>' + item.description + '</td>' +
                            '<td>R' + item.price.toFixed(0) + '</td>' +
                            '<td>' + item.available + '</td>' +
                            '<td><button class="buy-btn" onclick="buyItem(' + item.itemId + ')">Buy this item</button></td>';
                        tbody.appendChild(row);
                    });
                }
            })
            .catch(function(error) {
                console.log('Error loading items: ' + error);
            });
        }

        // Buy an item (add to cart)
        function buyItem(itemId) {
            fetch('api/buy', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    itemId: itemId,
                    quantity: 1
                })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                alert(data.message);
            })
            .catch(function(error) {
                alert('Error adding item to cart');
            });
        }

        // Search items
        function searchItems() {
            var query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.location.href = 'search.html?query=' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchItems();
            }
        });
    </script>
</body>
</html>
