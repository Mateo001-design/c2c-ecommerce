<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - Buy an Item</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #0066cc;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-right: 25px;
            font-size: 16px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            width: 200px;
        }
        .search-box button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
        }
        .content {
            padding: 30px 50px;
        }
        h2 {
            color: #006600;
            text-align: center;
            font-size: 28px;
        }
        .buy-form {
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            border: 2px solid #66cccc;
            background-color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #006600;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #0055aa;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success { color: green; background: #e6ffe6; }
        .error { color: red; background: #ffe6e6; }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #0066cc;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div>
            <a href="main.html">Home</a>
            <a href="viewall.html">View All Items</a>
            <a href="buy.html">Buy an Item</a>
            <a href="viewcart.html">View Cart</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Items">
            <button onclick="searchItems()">&#128269;</button>
        </div>
    </div>

    <!-- Content area -->
    <div class="content">
        <h2>Buy an Item</h2>

        <div class="buy-form">
            <form id="buyForm" onsubmit="return handleBuy(event)">
                <div class="form-group">
                    <label>Select Item:</label>
                    <select id="itemSelect" required>
                        <option value="">-- Select an item --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity:</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label>Item Price:</label>
                    <input type="text" id="itemPrice" readonly>
                </div>

                <button type="submit" class="submit-btn">Add to Cart</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <p class="back-link">Go back to <a href="main.html">Main Menu</a></p>
    </div>

    <script>
        // Load items into the dropdown when the page loads
        window.onload = function() {
            loadItems();
        };

        // Fetch items for the dropdown
        function loadItems() {
            fetch('api/buy')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    var select = document.getElementById('itemSelect');
                    data.items.forEach(function(item) {
                        var option = document.createElement('option');
                        option.value = item.itemId;
                        option.textContent = item.itemId + ' - ' + item.name + ' (' + item.color + ') - R' + item.price.toFixed(0);
                        option.setAttribute('data-price', item.price);
                        select.appendChild(option);
                    });
                }
            })
            .catch(function(error) {
                console.log('Error loading items: ' + error);
            });
        }

        // Update price display when item is selected
        document.getElementById('itemSelect').addEventListener('change', function() {
            var selected = this.options[this.selectedIndex];
            var price = selected.getAttribute('data-price');
            if (price) {
                document.getElementById('itemPrice').value = 'R' + parseFloat(price).toFixed(2);
            } else {
                document.getElementById('itemPrice').value = '';
            }
        });

        // Handle buy form submission
        function handleBuy(event) {
            event.preventDefault();

            var itemId = parseInt(document.getElementById('itemSelect').value);
            var quantity = parseInt(document.getElementById('quantity').value);

            fetch('api/buy', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    itemId: itemId,
                    quantity: quantity
                })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var msgDiv = document.getElementById('message');
                msgDiv.textContent = data.message;
                msgDiv.style.display = 'block';

                if (data.success) {
                    msgDiv.className = 'message success';
                } else {
                    msgDiv.className = 'message error';
                }
            })
            .catch(function(error) {
                var msgDiv = document.getElementById('message');
                msgDiv.textContent = 'Error adding item to cart. Please login first.';
                msgDiv.className = 'message error';
                msgDiv.style.display = 'block';
            });

            return false;
        }

        // Search items
        function searchItems() {
            var query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.location.href = 'search.html?query=' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchItems();
            }
        });
    </script>
</body>
</html>
