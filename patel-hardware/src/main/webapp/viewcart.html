<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - View Cart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #0066cc;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-right: 25px;
            font-size: 16px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            width: 200px;
        }
        .search-box button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
        }
        .content {
            padding: 30px 50px;
        }
        h2 {
            color: #006600;
            text-align: center;
            font-size: 28px;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            border: 2px solid #66cccc;
        }
        th, td {
            border: 1px solid #66cccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #e6ffff;
            font-weight: bold;
        }
        .total-row {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }
        .empty-cart {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-top: 20px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #0066cc;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div>
            <a href="main.html">Home</a>
            <a href="viewall.html">View All Items</a>
            <a href="buy.html">Buy an Item</a>
            <a href="viewcart.html">View Cart</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Items">
            <button onclick="searchItems()">&#128269;</button>
        </div>
    </div>

    <!-- Content area -->
    <div class="content">
        <h2>View Cart</h2>

        <table id="cartTable">
            <thead>
                <tr>
                    <th>ITEM#</th>
                    <th>NAME</th>
                    <th>COLOR</th>
                    <th>DESCRIPTION</th>
                    <th>PRICE</th>
                    <th>QUANTITY</th>
                    <th>SUBTOTAL</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <!-- Cart items will be loaded here -->
            </tbody>
        </table>

        <div id="totalRow" class="total-row"></div>
        <div id="emptyMsg" class="empty-cart" style="display:none;">Your cart is empty.</div>

        <p class="back-link">Go back to <a href="main.html">Main Menu</a></p>
    </div>

    <script>
        // Load cart items when page loads
        window.onload = function() {
            loadCart();
        };

        // Fetch cart items from the server
        function loadCart() {
            fetch('api/cart')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    var tbody = document.getElementById('cartBody');
                    tbody.innerHTML = '';

                    if (data.cartItems.length === 0) {
                        document.getElementById('emptyMsg').style.display = 'block';
                        document.getElementById('cartTable').style.display = 'none';
                        return;
                    }

                    data.cartItems.forEach(function(item) {
                        var row = document.createElement('tr');
                        row.innerHTML = '<td>' + item.itemId + '</td>' +
                            '<td>' + item.name + '</td>' +
                            '<td>' + item.color + '</td>' +
                            '<td>' + item.description + '</td>' +
                            '<td>R' + item.price.toFixed(2) + '</td>' +
                            '<td>' + item.quantity + '</td>' +
                            '<td>R' + item.subtotal.toFixed(2) + '</td>';
                        tbody.appendChild(row);
                    });

                    // Display total price
                    document.getElementById('totalRow').textContent =
                        'Total: R' + data.totalPrice.toFixed(2);
                } else {
                    document.getElementById('emptyMsg').textContent = data.message;
                    document.getElementById('emptyMsg').style.display = 'block';
                    document.getElementById('cartTable').style.display = 'none';
                }
            })
            .catch(function(error) {
                document.getElementById('emptyMsg').textContent = 'Please login to view your cart.';
                document.getElementById('emptyMsg').style.display = 'block';
                document.getElementById('cartTable').style.display = 'none';
            });
        }

        // Search items
        function searchItems() {
            var query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.location.href = 'search.html?query=' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchItems();
            }
        });
    </script>
</body>
</html>
