<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1200') center/cover no-repeat;
            background-color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
        }
        h1 {
            color: #00cc00;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            text-align: left;
            color: #006600;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }
        .login-link a {
            color: #0066cc;
        }
        .message {
            margin-bottom: 10px;
            display: none;
            padding: 8px;
            border-radius: 4px;
        }
        .success { color: green; background: #e6ffe6; }
        .error { color: red; background: #ffe6e6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PATEL HARDWARE</h1>

        <div id="message" class="message"></div>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="btn">Register</button>
        </form>

        <p class="login-link">Already registered? <a href="index.html">Login here</a></p>
    </div>

    <script>
        // Handle the registration form submission
        function handleRegister(event) {
            event.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Send registration request as JSON
            fetch('api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var msgDiv = document.getElementById('message');
                msgDiv.textContent = data.message;
                msgDiv.style.display = 'block';

                if (data.success) {
                    msgDiv.className = 'message success';
                    // Redirect to login after 2 seconds
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    msgDiv.className = 'message error';
                }
            })
            .catch(function(error) {
                var msgDiv = document.getElementById('message');
                msgDiv.textContent = 'Connection error. Please try again.';
                msgDiv.className = 'message error';
                msgDiv.style.display = 'block';
            });

            return false;
        }
    </script>
</body>
</html>
